title: "Beyond Sentiment: Emotion Detection in Moroccan Darija"
students:
  - "Soulaymane Boulaich"
  - "Fares Ilham"
  - "Tasnim Touil"
description: >-
  Can a model go beyond positive and negative sentiment in Moroccan Darija?
  We plan to fine-tune a pretrained Darija language model to detect anger,
  fear, joy and sadness in short texts and compare it with a lightweight
  baseline. We will also test whether simple text normalization helps, and
  study which close emotions the model confuses most often.

